---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rex-server
  labels:
    app.kubernetes.io/name: rex
    app.kubernetes.io/instance: rex-server
spec:
  replicas: 1
  # SQLite has a single writer, so two pods must never hold the database at
  # once -- which a rolling update would do by design.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rex
      app.kubernetes.io/instance: rex-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rex
        app.kubernetes.io/instance: rex-server
    spec:
      containers:
        - name: server
          image: ghcr.io/sierrasoftworks/rex-rs:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: info
            - name: REX_CONFIG
              value: /config/config.toml
            # Interpolated into config.toml at startup, so no secret is ever
            # written into the ConfigMap.
            - name: REX_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: oidc-client-id
                  name: rex-secrets
            - name: REX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: oidc-client-secret
                  name: rex-secrets
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              port: http
              path: /api/v1/health
            initialDelaySeconds: 5
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              port: http
              path: /api/v1/health
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: rex-config
        - name: data
          persistentVolumeClaim:
            claimName: rex-data

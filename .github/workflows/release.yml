name: Release
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

# Declaring any permission sets every unlisted scope to `none`, so this is the
# floor every job starts from. Jobs that need to write something ask for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: "0.0.0-dev"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BINARY_NAME: rex

jobs:
  version:
    name: Start Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Generate Package Version (Release Tag)
        shell: pwsh
        if: github.event_name == 'release'
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$('${{ github.event.release.tag_name }}'.substring(1))"

      # `:latest` is rebuilt from every push to main, so those builds need to be
      # able to say which commit they are -- telemetry from a fleet of images all
      # calling themselves 0.0.0-dev is not much use.
      - name: Generate Package Version (Main Build)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "VERSION=0.0.0-dev.${{ github.run_number }}+${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Scoped to the package tables: `ui/Cargo.toml` declares web-sys with a
      # `[dependencies.web-sys]` section whose `version =` sits at the start of
      # a line too, and rewriting that pins web-sys to a version nobody has.
      - name: Set Package Version
        run: |
          sed -i "/^\[workspace\.package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*\".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "/^\[package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*\".*\"/version = \"$VERSION\"/" ui/Cargo.toml

      - name: Stash Versioned Manifests
        uses: actions/upload-artifact@v7
        with:
          name: manifests
          path: |
            Cargo.toml
            ui/Cargo.toml

  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path ui/Cargo.toml --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo clippy (ui)
        run: cargo clippy --manifest-path ui/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo install grcov
        uses: SierraSoftworks/setup-grcov@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: cargo test --workspace --all-features --no-fail-fast
        env:
          RUSTFLAGS: "-C instrument_coverage"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The UI is outside the workspace, but the parts of it that are plain Rust
      # -- markdown rendering and its sanitisation, most importantly -- compile
      # and run for the host target just fine.
      - name: Run UI tests
        run: cargo test --manifest-path ui/Cargo.toml --no-fail-fast

      - name: grcov
        run: grcov . --binary-path target/debug/deps/ -s . -t lcov --ignore-not-existing --ignore '../**' --ignore '/*' --ignore 'C:/' -o ./lcov.info

      - name: codecov upload
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./lcov.info

  ui:
    name: Build UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui

      - name: Install Trunk
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm trunk wasm-bindgen-cli

      # Built twice on purpose: the debug bundle carries the controls gallery
      # and is what the end-to-end suite runs against, while the release bundle
      # is what gets embedded into the shipped binaries.
      - name: trunk build (debug)
        working-directory: ui
        run: trunk build

      - name: Upload debug dist
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist-debug
          path: ui/dist

      - name: trunk build (release)
        working-directory: ui
        run: trunk build --release

      - name: Upload release dist
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist-release
          path: ui/dist

  e2e:
    name: End to End
    runs-on: ubuntu-latest
    needs: ui

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      # The server embeds ui/dist at compile time, so the UI has to be in place
      # before cargo runs -- not after.
      - name: Fetch the debug UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist-debug
          path: ui/dist

      - name: cargo build
        run: cargo build -p rex-server

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: e2e
        run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}-release
    runs-on: ${{ matrix.run_on }}

    # Attaching binaries to the release writes to the repository.
    permissions:
      contents: write

    needs:
      - version
      - ui

    strategy:
      matrix:
        include:
          - arch: amd64
            os: windows
            run_on: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
            builder: cargo

          - arch: amd64
            run_on: ubuntu-latest
            os: linux
            target: x86_64-unknown-linux-musl
            builder: cargo
            setup: |
              sudo apt update && sudo apt install -y musl-tools
          - arch: arm64
            os: linux
            run_on: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cross

          - arch: amd64
            run_on: macos-latest
            os: darwin
            target: x86_64-apple-darwin
            builder: cargo
          - arch: arm64
            run_on: macos-latest
            os: darwin
            target: aarch64-apple-darwin
            builder: cargo

    steps:
      - name: Run setup script
        if: ${{ matrix.setup }}
        run: ${{ matrix.setup }}

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.builder == 'cross'
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cross

      - name: Fetch Versioned Manifests
        uses: actions/download-artifact@v8
        with:
          name: manifests

      # Must land before cargo runs: include_dir! embeds whatever is in
      # ui/dist at compile time, and an empty directory produces a binary that
      # serves an error page instead of the app.
      - name: Fetch the release UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist-release
          path: ui/dist

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo build
        run: ${{ matrix.builder }} build --release --target ${{ matrix.target }} -p rex-server --features ci_build

      - name: Upload GitHub Release Artifacts
        uses: SierraSoftworks/gh-releases@v1.0.10
        if: github.event_name == 'release'
        with:
          files: "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.extension }} | ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: "true"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}
          path: target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.extension }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    # Nothing reaches the registry unless the checks that gate it have passed:
    # `:latest` now tracks main, so a red build must not be publishable.
    needs:
      - build
      - check
      - test
      - e2e

    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: set environment variables
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: actions/checkout@v7

      - name: Pull in platform artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BINARY_NAME }}-${{ env.PLATFORM_PAIR }}

      - name: mark artifact as executable
        run: chmod +x ${{ env.BINARY_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.description=Randomly choose an idea for something to do

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs:
      - docker-build

    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: set environment variables
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}

[workspace]
resolver = "3"
members = ["api", "server", "tools/import-tables"]

# The UI is a wasm-only crate built by Trunk; it never participates in a native
# `cargo build`, so keeping it out of the workspace stops `cargo test` from
# trying to compile web-sys against the host target.
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
authors = ["Benjamin Pannell <benjamin@pannell.dev>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/SierraSoftworks/rex-rs"

[workspace.dependencies]
rex-api = { path = "api" }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"

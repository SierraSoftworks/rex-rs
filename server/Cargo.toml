[package]
name = "rex-server"
description = "Rex keeps track of your ideas for things to do and hands you a random one on demand."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rex"
path = "src/main.rs"

[features]
default = []
# Vendors OpenSSL for the release build matrix, where a system OpenSSL may not
# be present. Nothing in Rex needs OpenSSL directly; this exists only as an
# escape hatch if a transitive dependency drags it in.
ci_build = ["openssl-sys/vendored"]

[dependencies]
rex-api = { workspace = true, features = ["actix"] }

actix-cors = "0.7"
actix-http = "3.12"
actix-rt = "2.10"
actix-service = "2.0.2"
actix-web = "4.13"
arc-swap = "1.7"
chrono.workspace = true
dotenvy = "0.15"
filt-rs = { version = "1.1", features = ["regex", "serde"] }
futures = "0.3"
include_dir = "0.7"
md5 = "0.8"
mime_guess = "2.0"
openidconnect = { version = "4.0", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.52", features = ["full"] }
tokio-rusqlite = "0.7"
toml = "1.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-batteries = { git = "https://github.com/sierrasoftworks/tracing-batteries-rs.git", features = ["medama"] }
uuid = { version = "1.23", features = ["serde", "v4"] }

openssl-sys = { version = "0.9.116", features = ["vendored"], optional = true }

[dev-dependencies]
env_logger = "0.11"
log = "0.4"
wiremock = "0.6"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.23"

[lib]
name = "rex_server"
path = "src/lib.rs"
